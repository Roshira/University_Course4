groups:
  - name: database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0 or absent(pg_up)
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL недоступний" }
      - alert: TooManyConnections
        expr: sum(pg_stat_database_numbackends) > 80
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Забагато з'єднань з PostgreSQL ({{ $value }})" }
      - alert: LowCacheHitRatio
        # частка блоків з кешу; при майже нульовому навантаженні (< 10 блоків/с) не спрацьовує
        expr: |
          (
            sum(rate(pg_stat_database_blks_hit{datname="telemetry"}[5m]))
            / (sum(rate(pg_stat_database_blks_hit{datname="telemetry"}[5m])) + sum(rate(pg_stat_database_blks_read{datname="telemetry"}[5m])))
          ) < 0.9
          and
          (sum(rate(pg_stat_database_blks_hit{datname="telemetry"}[5m])) + sum(rate(pg_stat_database_blks_read{datname="telemetry"}[5m]))) > 10
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Cache hit ratio нижче 90%" }
      - alert: LongRunningQuery
        expr: db_longest_running_query_seconds > 30
        labels: { severity: warning }
        annotations: { summary: "Запит виконується довше 30 с" }
      - alert: DbWriteErrors
        expr: sum(increase(telemetry_events_write_errors_total[5m])) > 0
        labels: { severity: warning }
        annotations: { summary: "Помилки запису подій у БД" }

  - name: pipeline
    rules:
      - alert: QueueBacklog
        expr: sum(rabbitmq_queue_messages_ready{queue="telemetry.events"}) > 1000
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Черга telemetry.events накопичує повідомлення ({{ $value }})" }
      - alert: DeadLetters
        expr: sum(rabbitmq_queue_messages_ready{queue="telemetry.events.dead"}) > 0
        labels: { severity: warning }
        annotations: { summary: "Є повідомлення в DLQ" }
      - alert: NoEventsWritten
        # "or vector(0)": алерт спрацює і тоді, коли метрики немає зовсім (API не відповідає)
        expr: (sum(rate(telemetry_events_written_total[2m])) or vector(0)) == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Нові події не записуються в БД" }
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Сервіс {{ $labels.job }} ({{ $labels.instance }}) недоступний" }
      - alert: IngestWorkerReplicasMissing
        # репліки ingest-worker знаходяться через DNS: зупинений контейнер зникає зі списку цілей,
        # а не стає up == 0, тому окремо перевіряємо кількість реплік
        expr: count(up{job="ingest-worker"} == 1) < 2 or absent(up{job="ingest-worker"} == 1)
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Працює менше 2 реплік ingest-worker" }
      - alert: EventsDropped
        expr: sum(increase(telemetry_events_dropped_total[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: "Внутрішня черга API переповнена, події втрачаються" }

  - name: security
    rules:
      - alert: BruteForceSuspected
        expr: sum(increase(auth_logins_total{result=~"failure|locked"}[5m])) > 10
        labels: { severity: warning }
        annotations: { summary: "Багато невдалих спроб входу в систему моніторингу" }

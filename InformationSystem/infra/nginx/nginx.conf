# Єдина точка входу в систему. Кожен запит до Grafana / Prometheus / RabbitMQ UI спочатку
# перевіряється сервером авторизації (auth_request -> auth-server /auth/verify).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;
    # редіректи відносні: інакше nginx підставить свій внутрішній порт 80 замість 8080
    absolute_redirect off;

    # Адреси сервісів визначаються через DNS Docker при кожному запиті (а не один раз при старті):
    # nginx не падає, якщо якийсь сервіс ще не запущений, і знаходить контейнер після перестворення.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_server   http://auth-server:8000;
    set $grafana       http://grafana:3000;
    set $prometheus    http://prometheus:9090;
    set $rabbitmq      http://rabbitmq:15672;
    set $telemetry_api http://telemetry-api:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- внутрішні підзапити перевірки доступу
    location = /_auth {
        internal;
        proxy_pass $auth_server/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_auth_admin {
        internal;
        proxy_pass $auth_server/auth/verify?role=admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    # Неавторизований запит -> сторінка входу. Адресу повернення (next) формує auth-server із
    # $request_uri з правильним URL-кодуванням: так зберігається query-рядок і неможлива
    # ін'єкція заголовків через закодовані %0d%0a у шляху.
    location @login {
        rewrite ^ /auth/start-login break;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass $auth_server;
    }
    location @forbidden { return 302 /auth/users; }

    # ---------- сервер авторизації (сторінка входу, вихід, керування користувачами)
    location /auth/ {
        proxy_pass $auth_server;
    }

    # ---------- AnalyticsSystem API (публічне: сюди шле події tracker.js; аналітика захищена власним JWT)
    # ВАЖЛИВО: не весь /api/ — шлях /api/ використовує й сама Grafana.
    # ~* — без урахування регістру: Swagger генерує /api/Telemetry/..., /api/Auth/...
    location ~* ^/api/telemetry/ {
        proxy_pass $telemetry_api;
    }
    location ~* ^/api/auth/(login|register)$ {
        proxy_pass $telemetry_api;
    }
    location = /tracker.js { proxy_pass $telemetry_api; }
    location /swagger      { proxy_pass $telemetry_api; }

    # ---------- Prometheus (тільки admin)
    location /prometheus/ {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        proxy_pass $prometheus;
    }

    # ---------- RabbitMQ management UI (тільки admin; далі ще власний логін RabbitMQ)
    location = /rabbitmq { return 301 /rabbitmq/; }
    location /rabbitmq/ {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        proxy_pass $rabbitmq;
    }

    # стартова сторінка -> дашборд "Огляд системи"
    location = / {
        return 302 "/d/db-overview?from=now-30m&to=now";
    }

    # ---------- Grafana (будь-який авторизований користувач; роль передається з auth-server)
    location / {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;
        error_page 401 = @login;

        # proxy_set_header у location скасовує успадкування з server — повторюємо всі заголовки
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER    $auth_user;   # перезаписує будь-яке значення від клієнта
        proxy_set_header X-WEBAUTH-ROLE    $auth_role;
        proxy_set_header Upgrade           $http_upgrade;  # Grafana Live (websocket)
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass $grafana;
    }
}

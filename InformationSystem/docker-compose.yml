# AnalyticsSystem + контур моніторингу роботи БД
#   docker compose up -d --build      ->  http://localhost:8080  (логін/пароль з .env, за замовчуванням admin / admin12345)
#
# Назовні відкритий ЛИШЕ nginx (gateway). Grafana, Prometheus, RabbitMQ UI доступні тільки після
# входу через сервер авторизації (auth-server, Python + SQLite).
name: analytics-monitoring

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  # ------------------------------------------------------------------ 0. СУБД
  postgres:
    image: postgres:16-alpine
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c track_io_timing=on
      -c log_min_duration_statement=200
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_pass}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    # Порт назовні не відкриваємо: на Windows 5432 часто зайнятий локальним PostgreSQL.
    # Для pgAdmin/DBeaver розкоментуйте:  ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d telemetry"]
      interval: 5s
      retries: 20
    logging: *default-logging

  # ------------------------------------------------------------------ застосунок (курсова AnalyticsSystem)
  telemetry-api:
    build: ./TelemetrySystem.Api
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: telemetry-api
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=telemetry;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ASPNETCORE_ENVIRONMENT: Development   # Swagger: http://localhost:8080/swagger
    depends_on:
      postgres: { condition: service_healthy }
      tempo: { condition: service_started }
    logging: *default-logging

  # ------------------------------------------------------------------ 9. брокер повідомлень
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-telemetry}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-telemetry}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-monitoring.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12
    logging: *default-logging

  # ------------------------------------------------------------------ 1. генерація / актуалізація даних (Python)
  traffic-generator:
    build: { context: ./services, dockerfile: workers/Dockerfile }
    command: ["python", "generator.py"]
    environment:
      <<: *otel-env
      API_URL: http://telemetry-api:8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-telemetry}:${RABBITMQ_PASSWORD:-telemetry}@rabbitmq:5672/%2F
      BASE_SESSIONS_PER_SEC: ${GENERATOR_SESSIONS_PER_SEC:-3}
    depends_on:
      rabbitmq: { condition: service_healthy }
      telemetry-api: { condition: service_started }
    restart: unless-stopped
    logging: *default-logging

  ingest-worker:
    build: { context: ./services, dockerfile: workers/Dockerfile }
    command: ["python", "consumer.py"]
    environment:
      <<: *otel-env
      API_URL: http://telemetry-api:8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-telemetry}:${RABBITMQ_PASSWORD:-telemetry}@rabbitmq:5672/%2F
    depends_on:
      rabbitmq: { condition: service_healthy }
      telemetry-api: { condition: service_started }
    restart: unless-stopped
    deploy: { replicas: 2 }
    logging: *default-logging

  # програмний моніторинг СУБД (SQL-запити до pg_stat_* -> метрики Prometheus)
  db-monitor:
    build: { context: ./services, dockerfile: workers/Dockerfile }
    command: ["python", "db_monitor.py"]
    environment:
      <<: *otel-env
      DATABASE_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telemetry
      SCRAPE_INTERVAL: "15"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  # ------------------------------------------------------------------ 2-3. збір метрик + TSDB
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telemetry?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus           # вбудована Time Series DB
      - --storage.tsdb.retention.time=15d
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus
      - --web.enable-remote-write-receiver        # Tempo пише сюди span-metrics / service graph
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    logging: *default-logging

  # ------------------------------------------------------------------ 5. логи
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *default-logging

  alloy:   # збирач логів усіх контейнерів (наступник Promtail) -> Loki
    image: grafana/alloy:v1.4.3
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    logging: *default-logging

  # ------------------------------------------------------------------ 6. трейси
  tempo:
    image: grafana/tempo:2.6.1
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    logging: *default-logging

  # ------------------------------------------------------------------ 4. відображення
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GATEWAY_PORT:-8080}/
      # Grafana довіряє лише заголовку від nginx, який ставить його після перевірки в auth-server
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_SYNC_TTL: "1"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: /auth/logout
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor tempoServiceGraph
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_pass}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    logging: *default-logging

  # ------------------------------------------------------------------ 7. авторизація
  auth-server:
    build: { context: ./services, dockerfile: auth-server/Dockerfile }
    environment:
      <<: *otel-env
      AUTH_DB_PATH: /data/auth.db
      AUTH_SECRET: ${AUTH_SECRET:-change-me-please-very-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      - auth-data:/data
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    ports: ["${GATEWAY_PORT:-8080}:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-server, grafana, prometheus, telemetry-api, rabbitmq]
    logging: *default-logging

volumes:
  pg-data:
  rabbit-data:
  prom-data:
  loki-data:
  tempo-data:
  grafana-data:
  auth-data:
